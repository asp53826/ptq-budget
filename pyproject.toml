[project]
name = "ptq-budget"
version = "0.1.0"
description = "Post-training quantization with error budgets: RTN, GPTQ and AWQ scored against an exact fp32 reference and a known entropy floor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a trained model"]
